name: Build PDF

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PreTeXt CLI
        run: pip install -r pretext/requirements.txt

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-latex-recommended \
            texlive-fonts-recommended texlive-fonts-extra texlive-science \
            texlive-lang-english texlive-plain-generic fonts-inconsolata \
            fonts-dejavu fonts-liberation latexmk imagemagick poppler-utils

      - name: Convert images for PreTeXt
        run: python3 copy_images.py

      - name: Build PDF (xelatex)
        run: |
          cd pretext
          pretext build print 2>&1 | tee build.log
          test -f output/print/main.pdf

      - name: Fail on LaTeX errors
        run: |
          cd pretext
          LOG=$(find output/print -name '*.log' | head -n 1)
          echo "LaTeX log: ${LOG:-none}"
          if grep -E '^! |LaTeX Error|Undefined control sequence|Emergency stop|Fatal error' build.log ${LOG:+"$LOG"}; then
            echo "::error::LaTeX errors found"
            exit 1
          fi
          echo "Warnings:"; grep -hE 'LaTeX Warning|Missing character|Package .* Warning' build.log ${LOG:+"$LOG"} | sort -u | head -50 || true

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: |
            pretext/output/print/main.pdf
            pretext/output/print/*.log
            pretext/build.log
          if-no-files-found: warn
